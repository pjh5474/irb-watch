[project]
name = "irb-watch"
version = "0.1.0"
description = "Server that scans hospital IRB pages and reports document changes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "beautifulsoup4",
    "playwright",
    "supabase",
    "pyjwt[crypto]",
    "email-validator",
    "apscheduler",
    "openai-agents",
    "pdfplumber",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = ["live: talks to the real Supabase project; runs only when RUN_LIVE=1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# The repo has a top-level supabase/ folder (CLI files); it is not our Python package.
known-third-party = ["supabase", "supabase_auth"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]
